name: Automatic News Analytics Pipeline

on:
  schedule:
    # Jalan otomatis setiap 30 menit sekali
    - cron: '*/30 * * * *'
  workflow_dispatch: # Supaya tetap bisa di-run manual kapan saja

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Full Analytics Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "1. Running Crawler..."
          python crawler.py
          
          echo "2. Running Sentiment Analysis (IndoBERT)..."
          python sentiment.py
          
          echo "3. Running Topic Modeling (BERTopic)..."
          python topic.py
          
          echo "4. Generating Recommendations..."
          python recommendation.py